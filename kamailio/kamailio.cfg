#!KAMAILIO

# SCube Labs - M1 SIP edge
# Development configuration only. No authentication/TLS/topology hiding yet.

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "method_filtering", 1)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP request from $si:$sp\n");
        exit;
    }

    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

    if (is_method("REGISTER")) {
        if (!save("location")) {
            sl_reply_error();
        }
        xlog("L_INFO", "Registration: $fu contact=$ct source=$si:$sp\n");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        }
        if (is_method("ACK") && t_check_trans()) {
            route(RELAY);
        }
        sl_send_reply("404", "Not here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) t_relay();
        exit;
    }

    if (is_method("INVITE")) {
        record_route();
    }

    # ACD pilot number: send to FreeSWITCH on the internal Docker network.
    if ($rU == "7000") {
        $du = "sip:172.28.0.20:5060";
        xlog("L_INFO", "Routing ACD call $ci for $rU to FreeSWITCH\n");
        route(RELAY);
    }

    # Agent/user destinations are resolved from in-memory registrations.
    if (lookup("location")) {
        route(RELAY);
    }

    sl_send_reply("404", "User Not Found");
    exit;
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
