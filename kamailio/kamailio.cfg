#!KAMAILIO
# Local M1 only: no SIP authentication. Published ports remain loopback-bound.
# Separate sockets keep Docker-private routes away from host-side softphones.
listen=udp:172.28.0.10:5060 advertise __LAB_PUBLIC_IP__:5060
listen=tcp:172.28.0.10:5060 advertise __LAB_PUBLIC_IP__:5060
listen=udp:172.28.0.10:5062
alias=__LAB_PUBLIC_IP__:5060

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "siputils.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"
loadmodule "ctl.so"

modparam("usrloc", "db_mode", 0)
# One lab realm: FS dials 1001@172.28.0.10; host UAs register 1001@127.0.0.1.
modparam("usrloc", "use_domain", 0)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("rr", "enable_double_rr", 2)
modparam("rr", "force_send_socket", 1)

request_route {
    force_rport();
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP request from $si:$sp\n");
        exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) t_relay();
        exit;
    }
    if (has_totag()) {
        if (loose_route()) route(RELAY);
        # Non-2xx ACK belongs to the original INVITE transaction.
        if (is_method("ACK") && t_check_trans()) route(RELAY);
        if (is_method("ACK")) exit;
        sl_send_reply("404", "Not here");
        exit;
    }
    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "Keepalive");
        exit;
    }
    if (is_method("REGISTER")) {
        # Only the three documented lab identities may register.
        if (!($tU =~ "^(1001|1002|2000)$")) {
            sl_send_reply("403", "Unknown Lab User");
            exit;
        }
        fix_nated_register();
        if (!save("location")) sl_reply_error();
        xlog("L_INFO", "Registration: $fu source=$si:$sp\n");
        exit;
    }
    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }
    if (t_precheck_trans()) {
        t_check_trans();
        exit;
    }
    t_check_trans();
    # Correct private/loopback Contact from a host UA; do not alter FS Contact.
    if ($si != "172.28.0.20" && nat_uac_test("19")) fix_nated_contact();
    # Echo isolates SIP/media before queue and agent testing.
    if ($rU =~ "^(7000|9196)$") {
        $du = "sip:172.28.0.20:5060";
        force_send_socket(udp:172.28.0.10:5062);
        record_route();
        route(RELAY);
    }
    # Agent legs come from FS; direct endpoint calls bypass media anchoring.
    if ($rU =~ "^(1001|1002|2000)$" && lookup("location")) {
        force_send_socket(udp:172.28.0.10:5060);
        record_route();
        route(RELAY);
    }
    sl_send_reply("404", "User Not Found");
    exit;
}

route[RELAY] {
    if (is_method("INVITE")) t_on_reply("NAT_REPLY");
    if (!t_relay()) sl_reply_error();
    exit;
}

onreply_route[NAT_REPLY] {
    if ($si != "172.28.0.20" && nat_uac_test("19")) fix_nated_contact();
}
