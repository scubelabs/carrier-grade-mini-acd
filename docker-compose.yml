services:
  kamailio:
    build: ./kamailio
    container_name: scubelabs-kamailio
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    networks:
      voice:
        ipv4_address: 172.28.0.10
    depends_on:
      - freeswitch

  freeswitch:
    build: ./freeswitch
    container_name: scubelabs-freeswitch
    restart: unless-stopped
    expose:
      - "5060/udp"
      - "8021/tcp"
    ports:
      - "16384-16484:16384-16484/udp"
    networks:
      voice:
        ipv4_address: 172.28.0.20

networks:
  voice:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
